<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salomão — Sem conexão</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            background: #f8faf9;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            text-align: center;
            max-width: 360px;
        }
        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: #3ecf8e;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 800;
            color: #052e16;
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 24px; }
        button {
            background: #3ecf8e;
            color: #052e16;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #66e2a8; }
        .hint { font-size: 12px; color: #9ca3af; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">S</div>
        <h1>Você está offline</h1>
        <p>Sem conexão com a internet, não foi possível carregar esta página. Suas últimas páginas visitadas continuam disponíveis.</p>
        <button onclick="window.location.reload()">Tentar novamente</button>
        <p class="hint">Verifique sua conexão e tente de novo.</p>
    </div>
</body>
</html>
